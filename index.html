function beep(clear=false){if(!prefs.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.frequency.setValueAtTime(clear?660:160,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(clear?990:90,audio.currentTime+.18);gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);osc.start();osc.stop(audio.currentTime+.26);}catch{}}
function resetInput(){filtered={x:0,y:0};}
function close(){modal.close();resetInput();}
function show(html){resetInput();$('modalContent').innerHTML=html;if(!modal.open)modal.showModal();}
function btn(id,text,primary=false){return `<button class="wide ${primary?'primary':''}" id="${id}">${text}</button>`;}
function format(t){return `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;}
function updateMode(){}
function calibration(){if(raw&&performance.now()-lastSensor<2000){base={...raw};filtered={x:0,y:0};toast('今の角度を基準にしました');return true;}toast('センサー値がありません。設定からセンサーを再接続してください');return false;}
function orientation(e){if(!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;raw=L.tilt(e.beta,e.gamma,screenAngle());lastSensor=performance.now();if(!sensorReady){sensorReady=true;base={...raw};} }
function screenAngle(){return window.screen.orientation?.angle??window.orientation??0;}
async function enableSensor(){// Called directly from the user's click: permission must precede any await.
 let permission;try{if(!window.isSecureContext)throw new Error('HTTPSのURLで開くと傾き操作が使えます。');if(!window.DeviceOrientationEvent)throw new Error('この端末では傾き操作に対応していません。');if(typeof DeviceOrientationEvent.requestPermission==='function'){permission=DeviceOrientationEvent.requestPermission();}if(permission&&await permission!=='granted')throw new Error('傾き操作が許可されませんでした。');
 if(!listen){addEventListener('deviceorientation',orientation);listen=true;}sensorReady=false;raw=null;mode='sensor';sensorWait=performance.now();updateMode();show('<h2>Loading</h2><p>遊びやすい角度で持ってください。</p>');
 setTimeout(()=>{if(mode!=='sensor')return;if(sensorReady){calibration();startLevel(prefs.selected);}else{mode='sensor';sensorError('センサー値を取得できませんでした。Safari / Chromeで直接開き、端末の設定を確認してください。');}},1600);
 }catch(e){mode='sensor';sensorError(e.message||'センサーを開始できませんでした。');}}
function sensorError(message){screen='sensorError';show('<h2>センサーを確認してください</h2><p>'+message+'</p>'+btn('backSetup','再接続する',true)+btn('errorHome','タイトルへ'));$('backSetup').onclick=setup;$('errorHome').onclick=title;}
function setup(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();}catch{}screen='setup';show('<p class="eyebrow">HOW TO PLAY</p><h2>ゆっくり、傾けて。</h2><p>金色の輪がゴール。黒い穴を避けて、球を運びましょう。少しずつ傾けるのがコツです。</p><p>遊ぶ角度でスマホを持ってから開始してください。操作方向が合わない場合は設定で反転できます。</p>'+btn('sensor','傾き操作を許可して始める',true)+btn('backHome','タイトルに戻る'));$('sensor').onclick=enableSensor;$('backHome').onclick=title;}
function startLevel(n){close();prefs.selected=n;save();level=L.makeLevel(n);ball=L.state(level);screen='game';acc=0;resetInput();if(mode==='sensor'&&raw)base={...raw};document.body.classList.add('playing');$('hero').hidden=true;$('titleActions').hidden=true;$('gameActions').hidden=false;$('playbar').hidden=false;$('stageNum').textContent=`全20ステージ`;$('stageTitle').textContent=level.title;$('best').textContent=prefs.best[n]?'BEST '+format(prefs.best[n]):'BEST —';document.documentElement.style.setProperty('--ratio',level.W/level.H);updateMode();resize();}
function title(){close();screen='title';document.body.classList.remove('playing');$('hero').hidden=false;$('titleActions').hidden=false;$('gameActions').hidden=true;$('playbar').hidden=true;level=L.makeLevel(3);ball=L.state(level);$('start').innerHTML=(prefs.cleared.length?'続きから遊ぶ':'はじめる')+' <span>↗</span>';resize();}
function stageSelect(){screen='select';let html='<p class="eyebrow">TWENTY LITTLE JOURNEYS</p><h2>迷路を選ぶ</h2><p>好きなステージから遊べます。金色の枠はクリア済み。</p><div class="stagegrid">';for(let n=0;n<20;n++)html+=`<button data-stage="${n}" class="${prefs.cleared.includes(n)?'done ':''}${prefs.selected===n?'current':''}" aria-label="ステージ${n+1}${prefs.cleared.includes(n)?' クリア済み':''}">${String(n+1).padStart(2,'0')}</button>`;html+='</div><p>01–03 基本とピン　04–10 穴とピン<br>11–15 動く仕掛け　16–20 氷と戻りワープ</p>'+btn('selectBack','タイトルへ');show(html);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{prefs.selected=+b.dataset.stage;save();setup();});$('selectBack').onclick=title;}
function pause(){if(screen!=='game')return;screen='paused';show('<p class="eyebrow">TAKE A BREATH</p><h2>ひと休み。</h2><p>時間も球も止まっています。</p>'+btn('resume','再開する',true)+btn('pauseRetry','このステージをやり直す')+btn('pauseSelect','ステージを選ぶ')+btn('pauseHome','タイトルへ'));$('resume').onclick=()=>{close();screen='game';last=performance.now();};$('pauseRetry').onclick=()=>startLevel(prefs.selected);$('pauseSelect').onclick=stageSelect;$('pauseHome').onclick=title;}
function settings(){const previous=screen;screen='settings';show('<p class="eyebrow">MAKE IT YOURS</p><h2>手になじむ設定</h2><label>感度 <input id="sensitivity" aria-label="感度" type="range" min="0.4" max="2" step="0.1" value="'+prefs.sensitivity+'"></label><label>効果音 <input type="checkbox" id="sound" '+(prefs.sound?'checked':'')+'></label><label>左右を反転 <input type="checkbox" id="flipX" '+(prefs.flipX?'checked':'')+'></label><label>上下を反転 <input type="checkbox" id="flipY" '+(prefs.flipY?'checked':'')+'></label><label>描画品質 <select id="quality"><option value="high">高画質</option><option value="low">省電力</option></select></label>'+btn('changeMode','センサーを再接続する')+'<div class="divider"></div><p>進行はこのブラウザだけに保存します。ブラウザのデータを削除すると消えます。ゲームから入力情報を外部送信しません。</p>'+btn('settingsDone','設定を保存して戻る',true));$('quality').value=prefs.quality;const commit=()=>{prefs.sensitivity=+$('sensitivity').value;for(const k of ['sound','flipX','flipY'])prefs[k]=$(k).checked;prefs.quality=$('quality').value;save();resize();};$('settingsDone').onclick=()=>{commit();close();if(previous==='game'||previous==='paused'){screen='game';pause();}else title();};$('changeMode').onclick=()=>{commit();setup();};}
function finish(){if(ball.status==='clear'){if(!prefs.cleared.includes(level.index))prefs.cleared.push(level.index);prefs.best[level.index]=Math.min(prefs.best[level.index]||Infinity,ball.t);save();screen='clear';beep(true);show('<p class="eyebrow">BEAUTIFULLY DONE</p><h2>GOAL</h2><p>'+level.title+'<br>TIME '+format(ball.t)+'　/　BEST '+format(prefs.best[level.index])+'</p>'+(level.index<19?btn('next','次の迷路へ',true):'<p>20番目の迷路をクリア。ほかの迷路も、もう一度。</p>')+btn('again','もう一度遊ぶ')+btn('choose','ステージを選ぶ'));if($('next'))$('next').onclick=()=>startLevel(level.index+1);$('again').onclick=()=>startLevel(level.index);$('choose').onclick=stageSelect;}else{screen='fallen';beep();show('<p class="eyebrow">ONE MORE TRY</p><h2>あと、もう少し。</h2><p>穴に落ちました。小さく傾けて、ゆっくり進んでみましょう。</p>'+btn('again','すぐに再挑戦',true)+btn('choose','ステージを選ぶ'));$('again').onclick=()=>startLevel(level.index);$('choose').onclick=stageSelect;}}
function round(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function wood(c,x,y,w,h,seed,dark=false){let g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,dark?'#88603b':'#d7ae76');g.addColorStop(.3,dark?'#b58650':'#ecd0a1');g.addColorStop(.7,dark?'#a47844':'#d8b078');g.addColorStop(1,dark?'#77502e':'#c89c65');c.fillStyle=g;c.fillRect(x,y,w,h);c.save();c.beginPath();c.rect(x,y,w,h);c.clip();let rand=L.rng(seed);for(let i=0;i<230;i++){const yy=y+rand()*h;c.beginPath();c.moveTo(x,yy);c.bezierCurveTo(x+w*.3,yy+rand()*7-3,x+w*.7,yy+rand()*7-3,x+w,yy+rand()*4-2);c.strokeStyle=`rgba(91,49,19,${.025+rand()*.08})`;c.lineWidth=.3+rand()*.5;c.stroke();}c.restore();}
function resize(){dpr=prefs.quality==='low'?1:Math.min(window.devicePixelRatio||1,2);canvas.width=level.W*dpr;canvas.height=level.H*dpr;boardCache=document.createElement('canvas');boardCache.width=canvas.width;boardCache.height=canvas.height;const c=boardCache.getContext('2d');c.scale(dpr,dpr);c.save();round(c,0,0,level.W,level.H,16);c.clip();wood(c,0,0,level.W,level.H,33,true);c.shadowColor='#382311a0';c.shadowBlur=9;c.shadowOffsetY=3;c.fillStyle='#62452d';round(c,12,12,level.W-24,level.H-24,8);c.fill();c.shadowColor='transparent';wood(c,20,20,300,level.H-40,level.index+89);for(const z of level.ice){c.fillStyle='#c5eef09c';c.beginPath();z.points.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.fill();c.strokeStyle='#f0ffff8a';c.lineWidth=1;c.beginPath();c.moveTo(z.x+5,z.y+z.h-9);c.lineTo(z.x+z.w-9,z.y+6);c.moveTo(z.x+15,z.y+z.h-6);c.lineTo(z.x+z.w-5,z.y+14);c.stroke();}for(const p of level.holes){let g=c.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,p.r+3);g.addColorStop(0,'#0b0d0c');g.addColorStop(.65,'#1f1711');g.addColorStop(.85,'#614125');g.addColorStop(1,'#edc88b');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r+3,0,Math.PI*2);c.fill();}for(const w of level.walls){c.shadowColor='#4b2c2470';c.shadowBlur=3;c.shadowOffsetX=3;c.shadowOffsetY=5;c.fillStyle='#946333';c.fillRect(w.x,w.y,w.w,w.h);c.shadowColor='transparent';c.fillStyle='#e7c48c';c.fillRect(w.x-1,w.y-3,w.w,w.h);c.fillStyle='#fae2ad';c.fillRect(w.x-1,w.y-3,w.w,1);c.fillStyle='#aa773c';c.fillRect(w.x+w.w-2,w.y-2,1,w.h-1);}
 for(const p of level.pins){c.save();c.shadowColor='#39271899';c.shadowBlur=2;c.shadowOffsetX=2;c.shadowOffsetY=4;let g=c.createRadialGradient(p.x-1,p.y-2,0,p.x,p.y,p.r);g.addColorStop(0,'#fff2cb');g.addColorStop(.45,'#baaa88');g.addColorStop(1,'#514b40');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();c.shadowColor='transparent';c.strokeStyle='#655c48';c.beginPath();c.moveTo(p.x-2,p.y);c.lineTo(p.x+2,p.y);c.stroke();c.restore();}
 for(const p of [{x:9,y:9},{x:331,y:9},{x:9,y:level.H-9},{x:331,y:level.H-9}]){c.fillStyle='#57452f';c.beginPath();c.arc(p.x,p.y,2.6,0,Math.PI*2);c.fill();c.strokeStyle='#c5a97a';c.beginPath();c.moveTo(p.x-1,p.y-1);c.lineTo(p.x+1,p.y+1);c.stroke();}c.restore();draw();}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,level.W,level.H);ctx.drawImage(boardCache,0,0,level.W,level.H);const c=ctx;for(const w of level.warps){c.strokeStyle=w.to===1?'#2b859a':'#7452a7';c.lineWidth=3;c.beginPath();c.arc(w.x,w.y,w.r,0,Math.PI*2);c.stroke();c.lineWidth=1;c.beginPath();c.arc(w.x,w.y,w.r-4,0,Math.PI*2);c.stroke();c.fillStyle='#ffffffb0';c.font='8px sans-serif';c.textAlign='center';c.fillText(w.to===null?'出':'戻',w.x,w.y+3);}
 const g=level.goal;c.fillStyle='#56664d';c.beginPath();c.arc(g.x,g.y,14,0,Math.PI*2);c.fill();c.strokeStyle='#f7dca3';c.lineWidth=2;c.stroke();c.strokeStyle='#dbc28c';c.beginPath();c.arc(g.x,g.y,10,0,Math.PI*2);c.stroke();c.fillStyle='#f9e5b5';c.font='7px sans-serif';c.textAlign='center';c.fillText('GOAL',g.x,g.y+2.5);
 for(const gate of level.gates){const open=L.gateOpen(gate,ball.t)||ball.gateHeld[level.gates.indexOf(gate)];c.globalAlpha=open?.22:1;c.fillStyle='#826b3e';c.fillRect(gate.x,gate.y,gate.w,gate.h);c.fillStyle='#eed197';if(gate.w>gate.h)c.fillRect(gate.x,gate.y-2,gate.w,2);else c.fillRect(gate.x-2,gate.y,2,gate.h);c.globalAlpha=1;}
 for(const m of level.movers){const p=L.moverAt(m,ball.t);c.strokeStyle='#70583b50';c.lineWidth=2;c.beginPath();c.moveTo(m.x-m.amp,m.y);c.lineTo(m.x+m.amp,m.y);c.stroke();let grad=c.createRadialGradient(p.x-2,p.y-3,0,p.x,p.y,7);grad.addColorStop(0,'#ffe8ac');grad.addColorStop(.5,'#be914a');grad.addColorStop(1,'#6b4b23');c.fillStyle=grad;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();}
 const x=ball.x,y=ball.y;c.save();c.shadowColor='#332a23a0';c.shadowBlur=4;c.shadowOffsetX=2;c.shadowOffsetY=4;c.fillStyle='#777';c.beginPath();c.arc(x,y,L.R,0,Math.PI*2);c.fill();c.shadowColor='transparent';let metal=c.createRadialGradient(x-2.7,y-3.2,.2,x+.7,y+1,L.R+1);metal.addColorStop(0,'#ffffff');metal.addColorStop(.18,'#eff5f1');metal.addColorStop(.4,'#a7b1ac');metal.addColorStop(.6,'#59625e');metal.addColorStop(.78,'#d2d5c5');metal.addColorStop(1,'#4d5149');c.fillStyle=metal;c.fill();c.strokeStyle='#eeefdb80';c.lineWidth=.7;c.stroke();c.restore();
}
function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-last)/1000||0,.08);last=now;if(screen==='game'&&!document.hidden){if(mode==='sensor'&&now-lastSensor>2500&&now-sensorWait>2500){resetInput();sensorError('センサーの受信が止まったためゲームを停止しました。端末を確認して再接続してください。');return;}let target=raw?L.control(raw,base,prefs.sensitivity,prefs.flipX,prefs.flipY):{x:0,y:0};const f=1-Math.exp(-dt*14);filtered.x+=(target.x-filtered.x)*f;filtered.y+=(target.y-filtered.y)*f;acc+=dt;while(acc>=L.DT){L.step(ball,level,filtered);acc-=L.DT;if(ball.status!=='playing'){finish();acc=0;break;}}$('time').textContent=format(ball.t);}if((screen==='game'||frameCount===0)&&(prefs.quality!=='low'||frameCount%2===0))draw();frameCount++;}
$('start').onclick=setup;$('selectTitle').onclick=stageSelect;$('home').onclick=()=>{if(screen==='game')pause();else title();};$('settings').onclick=settings;$('retry').onclick=()=>startLevel(prefs.selected);$('pause').onclick=pause;$('calibrate').onclick=calibration;
addEventListener('blur',()=>{resetInput();pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});addEventListener('orientationchange',()=>{sensorReady=false;raw=null;resetInput();pause();});modal.addEventListener('cancel',e=>{e.preventDefault();});addEventListener('resize',resize);title();requestAnimationFrame(tick);
})();
